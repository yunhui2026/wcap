name: build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/README.md'
      - '**/assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build x64
        shell: cmd
        run: build.cmd x64

      - name: Verify binary exists
        shell: cmd
        run: dir wcap-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-x64
          path: wcap-x64.exe
          if-no-files-found: error

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest wcap-x64.exe --title "屏幕录制（自动构建）" --notes "由 GitHub Actions 从本仓库源码自动编译，每次推送都会更新。单文件约 67KB，无需安装。构建来源 commit ${GITHUB_SHA:0:7}" --latest
